multinode: true

modelArtifacts:
  uri: "hf://ibm-granite/granite-3.1-3b-a800m-instruct"
  size: 100Gi
  authSecretName: "llm-d-hf-token"
  name: "ibm-granite/granite-3.1-3b-a800m-instruct"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
    connector: nixlv2
    secure: false

  inferencePool:
    create: false

  httpRoute:
    create: false

  epp:
    create: false

decode:
  parallelism:
    tensor: 2
    data: 1
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics" # decode vLLM service port (from routing.proxy.targetPort)
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.1
    modelCommand: custom
    command:
      - /bin/bash
      - -c
    args:
      - |-
        # Clear /dev/shm on start to prevent running out of space when crashes occur
        # https://github.com/llm-d/llm-d/issues/352
        find /dev/shm -type f -delete

        #################
        # RUN vLLM decode worker
        #################
        START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
      
        # --data-parallel-hybrid-lb: Use exernal load balancing across nodes, and internal load balancing within a node
        # --enable-expert-parallel:  Use TPxDP in attention, EP in MoE layers
        # --async-scheduling: Reduce white space between engine steps
        # --enable-dbo:  Dual batch overlap (DBO) overlaps compute with collective communication.
        # --enable-eplb: Expert-parallel load balancing reduces EP load imbalance by replicating heavily-used experts Performance-memory tradeoff: on DeepSeekV3 eplb uses an extra 2GB per redundant expert per GPU Divisibility constraint: num_routed_experts (256 for DSv3) + num_redundant_experts must be divisible by the number of GPUs.

        exec vllm serve \
          ibm-granite/granite-3.1-3b-a800m-instruct \
          --port 8200 \
          --trust-remote-code \
          --disable-uvicorn-access-log \
          --enable-expert-parallel \
          --tensor-parallel-size $TP_SIZE \
          --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
          --data-parallel-size-local $DP_SIZE_LOCAL \
          --data-parallel-address ${LWS_LEADER_ADDRESS} \
          --data-parallel-rpc-port 5555 \
          --data-parallel-start-rank $START_RANK \
          --kv_transfer_config '{"kv_connector":"NixlConnector",
                                  "kv_role":"kv_both"}' \
          --async-scheduling \
          --compilation_config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
          --kv-cache-memory-bytes=${KV_CACHE_MEMORY_BYTES-}
          --gpu-memory-utilization 0.85
          # --enable-dbo \
          # --dbo-decode-token-threshold 32 \
          # --data-parallel-hybrid-lb \
          # --enable-eplb \
          # --eplb-config '{"window_size":"1000",
          #                 "step_interval":"3000",
          #                 "num_redundant_experts":"32",
          #                 "log_balancedness":"False"}' \

    env:
    # VLLM_MOE_DP_CHUNK_SIZE is a tunable parameter.
    # Higher values increase the memory footprint of the hidden states in the MoE layers,
    # which decreases the available memory for KV Cache.
    # Lower values may cause poor performance, especially in load-imbalanced scenarios.
    # The value 384 was chosen to be greater than the concurrency expected to see on any DP rank.
    # If you increase the VLLM_MOE_DP_CHUNK_SIZE above 510 you will also need to increase the
    # default NVSHMEM_QP_DEPTH to be at least 2 * (chunk_size + 1), which will increase the
    # memory NVSHMEM allocates up front.
    # Has no effect when VLLM_ALL2ALL_BACKEND=deepep_high_throughput.
    - name: VLLM_MOE_DP_CHUNK_SIZE
      value: "384" # vLLM default is 256
    - name: DP_SIZE_LOCAL
      value: "2"
    # - name: TP_SIZE
    #   value: "1"
    - name: TRITON_LIBCUDA_PATH
      value: /usr/lib64
    - name: VLLM_SKIP_P2P_CHECK
      value: "1"
    - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
      value: "1"
    - name: VLLM_USE_DEEP_GEMM
      value: "1"
    - name: VLLM_ALL2ALL_BACKEND
      value: deepep_low_latency
    - name: NVIDIA_GDRCOPY
      value: enabled
    - name: NVSHMEM_REMOTE_TRANSPORT
      value: ibgda
    - name: NVSHMEM_IB_ENABLE_IBGDA
      value: "true"
    - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
      value: eth0
    - name: GLOO_SOCKET_IFNAME
      value: eth0
    - name: NCCL_SOCKET_IFNAME
      value: eth0
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    ports:
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 32Gi
        cpu: "2"
        nvidia.com/gpu: "2"
        # rdma/ib: 1
      requests:
        memory: 8Gi
        cpu: "500m"
        nvidia.com/gpu: "2"
        # rdma/ib: 1
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: shm
      mountPath: /dev/shm
    - name: torch-compile-cache
      mountPath: /.cache
    startupProbe:
      httpGet:
        path: /v1/models
        port: 8200
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /v1/models
        port: 8200
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "16Gi"
  - name: torch-compile-cache
    emptyDir: {}

prefill:
  parallelism:
    tensor: 1
    data: 2
    dataLocal: 1
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics" # prefill vLLM service port (from routing.servicePort)
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.1
    modelCommand: custom
    command:
      - /bin/bash
      - -c
    args:
      - |-
        # Clear /dev/shm on start to prevent running out of space when crashes occur
        # https://github.com/llm-d/llm-d/issues/352
        find /dev/shm -type f -delete

        #################
        # RUN vLLM prefill worker
        #################
        START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
      
        # --data-parallel-hybrid-lb: Use exernal load balancing across nodes, and internal load balancing within a node
        # --enable-expert-parallel: Use TPxDP in attention, EP in MoE layers
        # --async-scheduling: Reduce white space between engine steps
        # --enable-dbo: Dual batch overlap (DBO) overlaps compute with collective communication.
        # --enable-eplb:  Expert-parallel load balancing reduces EP load imbalance by replicating heavily-used experts Performance-memory tradeoff: on DeepSeekV3 eplb uses an extra 2GB per redundant expert per GPU Divisibility constraint: num_routed_experts (256 for DSv3) + num_redundant_experts must be divisible by the number of GPUs.

        exec vllm serve \
          ibm-granite/granite-3.1-3b-a800m-instruct \
          --port 8000 \
          --trust-remote-code \
          --disable-uvicorn-access-log \
          --enable-expert-parallel \
          --data-parallel-hybrid-lb \
          --tensor-parallel-size $TP_SIZE \
          --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
          --data-parallel-size-local $DP_SIZE_LOCAL \
          --data-parallel-address ${LWS_LEADER_ADDRESS} \
          --data-parallel-rpc-port 5555 \
          --data-parallel-start-rank $START_RANK \
          --kv_transfer_config '{"kv_connector":"NixlConnector",
                                  "kv_role":"kv_both"}' \
          --async-scheduling \
          --gpu-memory-utilization 0.9
          # --enable-dbo \
          # --dbo-prefill-token-threshold 32 \
          # --enable-eplb \
          # --eplb-config '{"window_size":"1000",
          #                 "step_interval":"3000",
          #                 "num_redundant_experts":"32",
          #                 "log_balancedness":"False"}' \
    env:
    - name: DP_SIZE_LOCAL
      value: "1"
    # - name: TP_SIZE
    #   value: "1"
    - name: TRITON_LIBCUDA_PATH
      value: /usr/lib64
    - name: VLLM_SKIP_P2P_CHECK
      value: "1"
    - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
      value: "1"
    - name: VLLM_USE_DEEP_GEMM
      value: "1"
    - name: VLLM_ALL2ALL_BACKEND
      value: allgather_reducescatter
    - name: NVIDIA_GDRCOPY
      value: enabled
    - name: NVSHMEM_REMOTE_TRANSPORT
      value: ibgda
    - name: NVSHMEM_IB_ENABLE_IBGDA
      value: "true"
    - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
      value: eth0
    - name: GLOO_SOCKET_IFNAME
      value: eth0
    - name: NCCL_SOCKET_IFNAME
      value: eth0
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    ports:
      - containerPort: 8000
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 32Gi
        cpu: "2"
        nvidia.com/gpu: "1"
        # rdma/ib: 1
      requests:
        memory: 8Gi
        cpu: "500m"
        nvidia.com/gpu: "1"
        # rdma/ib: 1
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: shm
      mountPath: /dev/shm
    - name: torch-compile-cache
      mountPath: /.cache
    startupProbe:
      httpGet:
        path: /v1/models
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /v1/models
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "16Gi"
  - name: torch-compile-cache
    emptyDir: {}
